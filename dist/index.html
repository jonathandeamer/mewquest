<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#e7edcf"><meta name="description" content="Mew Quest: a gentle garden adventure. Meet friends, gather Dreamies and find Jenn and Samuel."><title>Mew Quest</title><link rel="stylesheet" href="style.css"></head>
<body><audio id="soundtrack" src="assets/garden-treasures.wav" preload="none" loop></audio>
<main id="game-page" aria-label="Mew Quest garden adventure"><canvas id="game" width="960" height="540" tabindex="0" aria-label="Mew Quest. Arrows or A and D to move. C to jump. X to dash. R to rest. Greet every friend by landing beside them. Jump over Coco."></canvas>
<div class="hud"><div class="garden-badge"><strong>Mew Quest</strong><span id="area">The Lawn</span></div><div class="counters garden-badge"><span id="friends">Friends 0 / 5</span><span id="treats">Dreamies 0 / 12</span><span id="dash">✦ Dash Ready</span></div></div>
<div class="utility"><button id="sound" aria-label="Toggle music and sound effects" aria-pressed="false">Sound Off</button><button id="rest" aria-label="Return safely to your resting spot" title="Rest">↶</button><button id="pause" aria-label="Pause game">Ⅱ</button></div>
<div id="overlay" class="overlay hidden"><div class="menu-card"><span id="menu-eyebrow" class="eyebrow">A LITTLE BREATHER</span><h2 id="menu-title">Rest Your Paws</h2><p id="menu-copy">Your cosy place is waiting.</p><button class="primary" id="start">Keep Exploring →</button><span id="menu-foot" class="menu-foot">No rush. Enjoy the garden.</span></div></div>
<div id="toast" role="status" aria-live="polite"></div>
<div class="touch" aria-label="Phone game controls"><div class="movement-pad"><button data-key="left" aria-label="Move left">←</button><button data-key="right" aria-label="Move right">→</button></div><div class="action-pad"><button data-key="dash" class="dash-button" aria-label="Dash"><span>✦</span><small>Dash</small></button><button data-key="jump" class="jump-button" aria-label="Jump"><span>↑</span><small>Jump</small></button></div></div>
<div class="sr-only"><span id="friend-next" aria-live="polite"></span><span id="checkpoint"></span><span id="progress"></span></div>
</main><script type="module" src="game.mjs"></script></body></html>
